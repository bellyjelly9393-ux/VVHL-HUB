<!-- Full-height goalie leg pads, sitting in front of the stall bench. -->
<g filter="url(#shadow)" transform="translate(94 492) rotate(-3 50 110)"><use href="#pad"/></g>
<g filter="url(#shadow)" transform="translate(423 492) rotate(3 50 110)"><use href="#pad"/></g>
</svg>