  <path d="M24 78 Q43 93 74 84" fill="none" stroke="#c99c55" stroke-width="5"/>
  <path d="M33 89 L72 94" stroke="#161719" stroke-width="11" stroke-linecap="round"/>
</g>
<!-- Blocker and stick-holding glove. -->
