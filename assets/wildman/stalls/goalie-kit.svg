    <path d="M14 7 Q45 2 82 9 L87 23 86 189 Q84 207 70 212 L24 213 Q14 206 13 188 L12 24Z" fill="url(#padFace)" stroke="#6b6254" stroke-width="2"/>
    <path d="M16 21 L34 13 49 31 82 31 82 48 50 49 33 31 17 40Z" fill="url(#gold)" stroke="#7b5629" stroke-width="1.5"/>
    <path d="M16 53 L31 45 49 64 82 63 82 82 47 81 30 62 16 72Z" fill="#17181b" stroke="#b88e52" stroke-width="1"/>
    <path d="M17 94 L36 83 57 107 82 107 82 125 52 125 34 104 17 113Z" fill="url(#gold)" stroke="#7b5629" stroke-width="1.5"/>
    <path d="M17 136 L31 127 47 142 83 140 83 159 45 160 29 145 17 154Z" fill="#17181b" stroke="#b88e52" stroke-width="1"/>
    <path d="M17 169 Q48 163 81 168 L81 180 Q53 175 17 182Z" fill="url(#gold)"/>
    <path d="M21 190 L75 190 M21 201 L71 201" stroke="#8e8c86" stroke-width="2" opacity=".55"/>
    <path d="M22 19 L20 185 M76 20 L78 182" stroke="#fffdf5" stroke-width="2" opacity=".7"/>
    <path d="M8 22 L8 194 M92 26 L91 185" stroke="#c09b5e" stroke-width="2" stroke-dasharray="4 7" opacity=".75"/>
    <text x="47" y="174" fill="#25221e" font-size="12" font-weight="900" font-family="Arial,sans-serif" text-anchor="middle" letter-spacing="1">WM</text>
  </g>
</defs>
<!-- The stick leans against the far left of the locker. -->
<g filter="url(#shadow)" transform="rotate(-7 80 465)">
  <path d="M61 220 L74 221 112 679 100 680Z" fill="#e5e0d4" stroke="#252321" stroke-width="3"/>
