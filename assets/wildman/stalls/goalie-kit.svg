  <path d="M18 73 Q-1 53 11 32 L27 20 31 4 Q41 -2 51 13 L64 24 80 4 Q91 -3 97 15 L95 40 Q111 46 103 70 Q93 91 65 102 L29 99Z" fill="url(#glove)" stroke="#161719" stroke-width="5"/>
