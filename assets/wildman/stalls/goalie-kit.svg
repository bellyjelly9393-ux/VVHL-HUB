<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Wildman goalie equipment">
<title>Wildman goalie pads, catcher, blocker, mask and goalie stick</title>
<defs>
  <linearGradient id="padFace" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b8b6ad"/><stop offset=".14" stop-color="#f5f2e8"/><stop offset=".68" stop-color="#ede8dc"/><stop offset="1" stop-color="#97958e"/></linearGradient>
  <linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4a4846"/><stop offset=".46" stop-color="#151616"/><stop offset="1" stop-color="#050605"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#f5d68b"/><stop offset=".55" stop-color="#c19140"/><stop offset="1" stop-color="#6b4820"/></linearGradient>
  <linearGradient id="glove" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3eee0"/><stop offset=".55" stop-color="#d2c8b7"/><stop offset="1" stop-color="#85837f"/></linearGradient>
  <filter id="shadow" x="-35%" y="-25%" width="180%" height="170%"><feDropShadow dx="3" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".7"/></filter>
  <g id="pad">
