name: Opponent refresh
on:
  push:
    branches: [main, feature/opponent-weekly-refresh]
  pull_request:
    paths: ['hitmen-opponent*', 'lib/opponent-refresh.mjs', 'supabase/functions/hitmen-opponent-refresh/**', 'test-opponent-*', 'docs/sql/opponent_refresh*', '.github/workflows/opponent-refresh.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test-opponent-refresh.mjs test-vod-review.cjs test-deep-scout.cjs
      - run: node --check hitmen-opponent-intel.js && node --check hitmen-opponent-refresh.js && node --check api/hitmen-opponent-rosters.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/hitmen-opponent-refresh/index.ts
      - run: npm install --prefix /tmp/opponent-browser playwright@1.56.1
      - run: /tmp/opponent-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Opponent dashboard desktop and mobile
        env:
          NODE_PATH: /tmp/opponent-browser/node_modules
        run: node test-opponent-browser.cjs
