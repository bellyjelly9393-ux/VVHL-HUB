name: VOD worker checks
on:
  push:
    branches: [feature/video-review-worker, fix/vod-worker-management]
    paths: ['video-worker/**', '.github/workflows/vod-worker.yml']
  pull_request:
    paths: ['video-worker/**', '.github/workflows/vod-worker.yml']
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr
      - run: python -m unittest discover -s video-worker -v
